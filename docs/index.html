<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geek POS Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
:root{--bg:#06142c;--p:#0c2347;--p2:#11325f;--line:#214b78;--t:#f5f9ff;--m:#9db4cf;--c:#20d4ef;--b:#2466ff;--v:#7c4cff;--g:#27d39b;--r:#ff6876}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:radial-gradient(circle at 15% 10%,#12336e,#07162f 43%,#020915);color:var(--t);min-height:100vh}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(560px,96vw);background:linear-gradient(180deg,#11315b,#071b37);border:1px solid #245486;border-radius:28px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.35)}.logo{width:94px;height:94px;border-radius:24px;display:block;margin:auto}.box h1{text-align:center;margin:16px 0 5px}.box p{text-align:center;color:var(--m)}label{display:block;margin:12px 0 6px;color:#c5d8ec;font-weight:700}.in,select{width:100%;padding:12px 13px;border-radius:13px;background:#061a36;color:white;border:1px solid #28537e;outline:none}.btn{border:0;border-radius:12px;padding:11px 15px;background:#234d79;color:#fff;font:inherit;font-weight:700;cursor:pointer}.primary{background:linear-gradient(135deg,var(--b),var(--v))}.green{background:#148b68}.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#051427;border-left:1px solid #173d66;padding:18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;border-bottom:1px solid #193b61;padding-bottom:15px}.brand img{width:50px;height:50px;border-radius:15px}.nav{display:grid;gap:7px;margin-top:16px}.nav button{text-align:right;background:transparent;color:#d7e7f8;border:1px solid transparent;border-radius:12px;padding:11px}.nav button:hover,.nav button.active{background:#102d55;border-color:#24517f}.main{min-width:0}.top{height:72px;border-bottom:1px solid #183d66;background:rgba(5,18,37,.8);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.content{padding:20px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.card{background:linear-gradient(180deg,rgba(17,48,88,.95),rgba(7,28,56,.95));border:1px solid #1c4776;border-radius:18px;padding:17px}.kpi b{font-size:28px;display:block;margin-top:8px}.muted{color:var(--m)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.toolbar .in,.toolbar select{max-width:280px}.tablewrap{overflow:auto;border:1px solid #21486f;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px}th{background:#102d56;padding:11px;text-align:right;position:sticky;top:0}td{padding:10px;border-top:1px solid #173a60}tr:hover td{background:rgba(36,102,255,.05)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#173c67;color:#aedaff}.toast{position:fixed;left:24px;bottom:24px;background:#102d53;border:1px solid #2a5d91;padding:12px 15px;border-radius:12px;opacity:0;transform:translateY(40px);transition:.2s}.toast.on{opacity:1;transform:none}@media(max-width:900px){.shell{grid-template-columns:82px 1fr}.brand strong,.nav span{display:none}.g4{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div id="login" class="login"><div class="box"><img class="logo" src="logo.jpg"><h1>Geek POS Online</h1><p>لوحة الإدارة السحابية</p><label>Supabase URL</label><input id="url" class="in" dir="ltr" value="https://redkjjglxdouxplcljil.supabase.co"><label>Publishable Key</label><input id="key" class="in" dir="ltr" value="sb_publishable_3KBgfOWVfFapMfs_chTH-w_W8uWpfYc"><label>Email</label><input id="email" class="in" dir="ltr"><label>Password</label><input id="pass" type="password" class="in" dir="ltr"><button id="signIn" class="btn primary" style="width:100%;margin-top:16px">تسجيل الدخول</button><p style="font-size:12px">كلمة المرور لا يتم حفظها داخل الصفحة أو GitHub.</p></div></div>
<div id="app" class="shell hidden"><aside class="side"><div class="brand"><img src="logo.jpg"><strong>Geek POS</strong></div><div class="nav"><button class="active" data-page="dashboard">⌂ <span>الرئيسية</span></button><button data-page="customers">♙ <span>العملاء</span></button><button data-page="orders">▣ <span>الطلبات</span></button><button id="licensesNav" data-page="licenses" class="hidden">◇ <span>التراخيص</span></button></div></aside><main class="main"><header class="top"><h2 id="title">الرئيسية</h2><div><span id="who" class="muted"></span> <button id="logout" class="btn">خروج</button></div></header><section id="content" class="content"></section></main></div><div id="toast" class="toast"></div>
<script>
let sb,profile,page='dashboard';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2})+' ج.م';function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)}
$('#signIn').onclick=async()=>{try{localStorage.setItem('geek_url',$('#url').value);localStorage.setItem('geek_key',$('#key').value);localStorage.setItem('geek_email',$('#email').value);sb=window.supabase.createClient($('#url').value,$('#key').value);const {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(error)throw error;const {data,error:pe}=await sb.from('pos_profiles').select('user_id,business_id,branch_id,display_name,role').single();if(pe)throw pe;profile=data;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=(profile.display_name||$('#email').value)+' — '+profile.role;if(profile.role==='administrator')$('#licensesNav').classList.remove('hidden');go('dashboard')}catch(e){toast(e.message)}};
window.addEventListener('load',()=>{$('#url').value=localStorage.getItem('geek_url')||$('#url').value;$('#key').value=localStorage.getItem('geek_key')||$('#key').value;$('#email').value=localStorage.getItem('geek_email')||''});$('#logout').onclick=async()=>{await sb?.auth.signOut();location.reload()};$$('.nav button[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
async function go(p){page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const names={dashboard:'الرئيسية',customers:'العملاء',orders:'الطلبات',licenses:'التراخيص'};$('#title').textContent=names[p];if(p==='dashboard')dashboard();if(p==='customers')customers();if(p==='orders')orders();if(p==='licenses')licenses()}
async function dashboard(){const [{data:c},{data:o}]=await Promise.all([sb.from('pos_customers').select('id',{count:'exact'}),sb.from('pos_orders').select('id,total,status,order_type,created_at')]);const closed=(o||[]).filter(x=>x.status==='closed');const sales=closed.reduce((s,x)=>s+Number(x.total||0),0);$('#content').innerHTML=`<div class="grid g4"><div class="card kpi"><span class="muted">العملاء</span><b>${c?.length||0}</b></div><div class="card kpi"><span class="muted">إجمالي الطلبات</span><b>${o?.length||0}</b></div><div class="card kpi"><span class="muted">المبيعات المغلقة</span><b>${money(sales)}</b></div><div class="card kpi"><span class="muted">الدليفري المفتوح</span><b>${(o||[]).filter(x=>x.order_type==='delivery'&&!['closed','returned'].includes(x.status)).length}</b></div></div>`}
async function branches(){const {data}=await sb.from('pos_branches').select('id,name').order('name');return data||[]}
async function customers(){const bs=await branches();$('#content').innerHTML=`<div class="card"><div class="toolbar"><input id="q" class="in" placeholder="بحث بالاسم / الموبايل / العنوان / المنطقة"><select id="branch"><option value="">كل الفروع</option>${bs.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><input id="area" class="in" placeholder="فلترة بالمنطقة"><button id="export" class="btn green">تصدير Excel</button></div><div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الموبايل</th><th>العنوان</th><th>المنطقة</th><th>الطلبات</th><th>إجمالي التعامل</th><th>آخر طلب</th></tr></thead><tbody id="rows"></tbody></table></div></div>`;const load=async()=>{let q=sb.from('pos_customer_stats').select('*').order('last_order',{ascending:false,nullsFirst:false});if($('#branch').value)q=q.eq('branch_id',$('#branch').value);if($('#area').value)q=q.ilike('area',`%${$('#area').value}%`);const {data,error}=await q;if(error)return toast(error.message);const term=$('#q').value.trim().toLowerCase();const rows=(data||[]).filter(r=>!term||[r.name,r.mobile,r.address,r.area].some(v=>String(v||'').toLowerCase().includes(term)));$('#rows').innerHTML=rows.map(r=>`<tr><td>${esc(r.name)}</td><td dir="ltr">${esc(r.mobile)}</td><td>${esc(r.address)}</td><td>${esc(r.area)}</td><td>${r.order_count}</td><td>${money(r.total_spent)}</td><td>${r.last_order?new Date(r.last_order).toLocaleString('ar-EG'):'—'}</td></tr>`).join('');window._customerRows=rows};$('#q').oninput=load;$('#branch').onchange=load;$('#area').oninput=load;$('#export').onclick=()=>{const data=(window._customerRows||[]).map(r=>({'اسم العميل':r.name,'رقم الموبايل':r.mobile,'العنوان':r.address,'المنطقة':r.area,'عدد الطلبات':r.order_count,'إجمالي المشتريات':r.total_spent,'آخر طلب':r.last_order}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'العملاء');XLSX.writeFile(wb,'Geek-POS-Customers.xlsx')};load()}
async function orders(){const {data,error}=await sb.from('pos_orders').select('id,order_no,order_type,status,total,created_at,pos_customers(name,mobile),pos_drivers(name)').order('created_at',{ascending:false}).limit(1000);if(error)return toast(error.message);$('#content').innerHTML=`<div class="card"><div class="tablewrap"><table><thead><tr><th>#</th><th>النوع</th><th>العميل</th><th>الحالة</th><th>القيمة</th><th>التاريخ</th></tr></thead><tbody>${(data||[]).map(o=>`<tr><td>#${o.order_no}</td><td>${esc(o.order_type)}</td><td>${esc(o.pos_customers?.name||'')}</td><td><span class="badge">${esc(o.status)}</span></td><td>${money(o.total)}</td><td>${new Date(o.created_at).toLocaleString('ar-EG')}</td></tr>`).join('')}</tbody></table></div></div>`}
async function licenses(){if(profile.role!=='administrator')return;const {data,error}=await sb.from('pos_licenses').select('id,key_tail,status,customer_name,customer_phone,machine_hash,activated_at,last_seen_at').order('created_at');if(error)return toast(error.message);$('#content').innerHTML=`<div class="card"><div class="tablewrap"><table><thead><tr><th>آخر 4</th><th>الحالة</th><th>العميل</th><th>الهاتف</th><th>تاريخ التفعيل</th><th>آخر ظهور</th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td dir="ltr">••••-${esc(x.key_tail)}</td><td>${esc(x.status)}</td><td>${esc(x.customer_name||'')}</td><td>${esc(x.customer_phone||'')}</td><td>${x.activated_at?new Date(x.activated_at).toLocaleString('ar-EG'):'—'}</td><td>${x.last_seen_at?new Date(x.last_seen_at).toLocaleString('ar-EG'):'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
</script></body></html>
