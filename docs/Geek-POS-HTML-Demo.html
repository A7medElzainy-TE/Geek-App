<body><div id="toast" class="toast"></div><div id="modal" class="modal-backdrop hidden"><div id="modalBody" class="modal"></div></div><main id="root"></main><div class="demo-badge"><b>نسخة HTML تجريبية</b> — administrator / 1234 <button onclick="window.geek.__demoReset()">إعادة البيانات</button></div><script>(() => {
  const KEY = 'geek_pos_html_demo_v2';
  const now = () => new Date().toISOString();
  const id = (p='id') => p + '-' + (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(16).slice(2)));
  const clone = v => JSON.parse(JSON.stringify(v));

  function defaults(){
    const opened = new Date(Date.now()-45*60*1000).toISOString();
    return {
      version: 1,
      settings: {
        business_name:'Geek POS Demo', business_address:'القاهرة', business_phone:'01000000000',
        enable_dinein:true, enable_delivery:true, receipt_footer:'شكراً لزيارتكم', invoice_width:'80',
        default_printer:'', kitchen_printer:'',
        supabase_url:'https://redkjjglxdouxplcljil.supabase.co', supabase_key:'sb_publishable_demo', supabase_email:'', branch_id:''
      },
      users:[
        {id:'u-system',name:'مسؤول النظام',username:'administrator',password:'1234',role:'administrator',permissions:{},active:1,created_at:opened},
        {id:'u-admin',name:'مدير النشاط',username:'admin',password:'1234',role:'admin',permissions:{},active:1,created_at:opened},
        {id:'u-cashier',name:'كاشير تجريبي',username:'cashier',password:'1234',role:'cashier',permissions:{},active:1,created_at:opened}
      ],
      categories:[
        {id:'c-drinks',name:'مشروبات',sort_order:1,active:1},
        {id:'c-meals',name:'وجبات',sort_order:2,active:1},
        {id:'c-dessert',name:'حلويات',sort_order:3,active:1}
      ],
      products:[
        {id:'p-tea',category_id:'c-drinks',sku:'DR001',barcode:'10001',name:'شاي',price:20,cost:7,tax_rate:0,active:1},
        {id:'p-coffee',category_id:'c-drinks',sku:'DR002',barcode:'10002',name:'قهوة',price:35,cost:12,tax_rate:0,active:1},
        {id:'p-juice',category_id:'c-drinks',sku:'DR003',barcode:'10003',name:'عصير برتقال',price:45,cost:18,tax_rate:0,active:1},
        {id:'p-meal',category_id:'c-meals',sku:'FD001',barcode:'20001',name:'وجبة رئيسية',price:120,cost:62,tax_rate:0,active:1},
        {id:'p-burger',category_id:'c-meals',sku:'FD002',barcode:'20002',name:'برجر',price:95,cost:48,tax_rate:0,active:1},
        {id:'p-pasta',category_id:'c-meals',sku:'FD003',barcode:'20003',name:'باستا',price:85,cost:40,tax_rate:0,active:1},
        {id:'p-cake',category_id:'c-dessert',sku:'DS001',barcode:'30001',name:'قطعة كيك',price:55,cost:24,tax_rate:0,active:1},
        {id:'p-molten',category_id:'c-dessert',sku:'DS002',barcode:'30002',name:'مولتن كيك',price:75,cost:31,tax_rate:0,active:1}
      ],
      drivers:[
        {id:'d1',name:'أحمد الطيار',mobile:'01011111111',active:1},
        {id:'d2',name:'محمد الطيار',mobile:'01022222222',active:1}
      ],
      tables:Array.from({length:8},(_,i)=>({id:'t'+(i+1),name:'طاولة '+(i+1),area:i<6?'الصالة الرئيسية':'التراس',seats:i<4?4:6,sort_order:i+1,active:1})),
      payments:[
        {id:'pay-cash',name:'نقدي',code:'cash',active:1,sort_order:1},
        {id:'pay-card',name:'فيزا',code:'card',active:1,sort_order:2},
        {id:'pay-wallet',name:'محفظة',code:'wallet',active:1,sort_order:3}
      ],
      customers:[
        {id:'cust1',name:'عميل تجريبي',mobile:'01012345678',notes:'عميل مميز',created_at:opened,updated_at:opened}
      ],
      addresses:[
        {id:'addr1',customer_id:'cust1',label:'المنزل',address:'شارع التحرير - عمارة 12',area:'الدقي',is_default:1,notes:'',created_at:opened,updated_at:opened}
      ],
      orders:[],
      shifts:[{id:'shift-system',user_id:'u-system',opened_at:opened,opening_cash:500,status:'open',created_at:opened,updated_at:opened},{id:'shift-admin',user_id:'u-admin',opened_at:opened,opening_cash:500,status:'open',created_at:opened,updated_at:opened}],
      expenses:[]
    };
  }

  function load(){
    try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.users&&s.settings)return s; }catch(e){}
    const s=defaults(); save(s); return s;
  }
  function save(s){ localStorage.setItem(KEY,JSON.stringify(s)); }
  let db=load();
  const persist=()=>save(db);
  const ensureTimes=o=>{const n=now();if(!o.created_at)o.created_at=n;o.updated_at=n;return o};
  const active = x => x.active!==0 && x.active!==false;

  function customerFull(c){
    if(!c)return null;
    const out=clone(c); out.addresses=db.addresses.filter(a=>a.customer_id===c.id).sort((a,b)=>(b.is_default||0)-(a.is_default||0)); return out;
  }
  function decorateOrder(o){
    if(!o)return null; const x=clone(o);
    const c=db.customers.find(c=>c.id===x.customer_id), d=db.drivers.find(d=>d.id===x.driver_id), a=db.addresses.find(a=>a.id===x.address_id), t=db.tables.find(t=>t.id===x.table_id);
    x.customer_name=c?.name||''; x.customer_mobile=c?.mobile||''; x.driver_name=d?.name||''; x.address=a?.address||''; x.area=a?.area||''; x.table_name=t?.name||'';
    return x;
  }
  function calc(items=[],delivery=0,discount=0){const subtotal=items.reduce((s,i)=>s+Number(i.qty||1)*Number(i.unit_price||0),0);return{subtotal,delivery_fee:Number(delivery||0),discount:Number(discount||0),total:Math.max(0,subtotal+Number(delivery||0)-Number(discount||0))}}
  function nextOrderNo(){return db.orders.reduce((m,o)=>Math.max(m,Number(o.order_no||0)),0)+1}

  window.geek={
    bootstrap:async()=>({version:'0.2.0 HTML Demo',licensed:true,license:{demo:true},machineHash:'HTML-DEMO-'+navigator.platform,hasUsers:db.users.length>0,settings:clone(db.settings),supabaseDefault:{url:'https://redkjjglxdouxplcljil.supabase.co',key:'sb_publishable_demo'}}),
    activate:async()=>({success:true,message:'وضع HTML التجريبي مفعّل'}),
    createFirstUser:async d=>{const u={id:id('u'),name:d.name,username:d.username,password:d.password,role:'admin',permissions:{},active:1,created_at:now()};db.users.push(u);persist();return clone(u)},
    login:async(u,p)=>{const x=db.users.find(x=>x.username===String(u||'').trim()&&x.password===String(p||'')&&active(x));return x?{id:x.id,name:x.name,username:x.username,role:x.role,permissions:clone(x.permissions||{})}:null},

    users:{
      list:async()=>clone(db.users.map(({password,...x})=>x)),
      create:async d=>{if(!d.name||!d.username||!d.password)throw new Error('بيانات المستخدم غير مكتملة');if(db.users.some(x=>x.username===d.username))throw new Error('اسم المستخدم مستخدم بالفعل');const u=ensureTimes({id:id('u'),name:d.name,username:d.username,password:d.password,role:d.role||'cashier',permissions:d.permissions||{},active:1});db.users.push(u);persist();return clone(u)},
      update:async(uid,d)=>{const u=db.users.find(x=>x.id===uid);if(!u)throw new Error('المستخدم غير موجود');Object.assign(u,{name:d.name??u.name,role:d.role??u.role,active:d.active===undefined?u.active:(d.active?1:0),permissions:d.permissions??u.permissions});if(d.password)u.password=d.password;ensureTimes(u);persist();return true}
    },

    categories:async(all=false)=>clone(db.categories.filter(c=>all||active(c)).sort((a,b)=>a.sort_order-b.sort_order)),
    products:async(all=false)=>clone(db.products.filter(p=>all||active(p)).map(p=>({...p,category_name:db.categories.find(c=>c.id===p.category_id)?.name||''})).sort((a,b)=>(a.category_name+a.name).localeCompare(b.category_name+b.name,'ar'))),
    saveCategory:async d=>{if(!String(d.name||'').trim())throw new Error('اكتب اسم القسم');let c=d.id?db.categories.find(x=>x.id===d.id):null;if(c)Object.assign(c,d,{name:d.name.trim(),active:d.active===false?0:1});else{c=ensureTimes({id:id('c'),name:d.name.trim(),sort_order:Number(d.sort_order||db.categories.length+1),active:d.active===false?0:1});db.categories.push(c)}persist();return c.id},

    customers:{

      get:async cid=>customerFull(db.customers.find(c=>c.id===cid)),
      list:async search=>{const q=String(search||'').trim().toLowerCase();return clone(db.customers.filter(c=>{const as=db.addresses.filter(a=>a.customer_id===c.id);return !q||c.name.toLowerCase().includes(q)||c.mobile.includes(q)||as.some(a=>(a.address+' '+a.area).toLowerCase().includes(q))}).map(c=>{const as=db.addresses.filter(a=>a.customer_id===c.id).sort((a,b)=>(b.is_default||0)-(a.is_default||0));const def=as[0];const orders=db.orders.filter(o=>o.customer_id===c.id);const closed=orders.filter(o=>o.status==='closed');return {...c,address:def?.address||'',area:def?.area||'',order_count:orders.length,total_spent:closed.reduce((s,o)=>s+Number(o.total||0),0),last_order:orders.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0]?.created_at||null}}))},
      save:async d=>{const mobile=String(d.mobile||'').trim();if(!mobile)throw new Error('رقم الموبايل مطلوب');let c=db.customers.find(x=>x.mobile===mobile)||db.customers.find(x=>x.id===d.id);if(c)Object.assign(c,{name:d.name||c.name,mobile,notes:d.notes||'',updated_at:now()});else{c=ensureTimes({id:id('cust'),name:d.name||'',mobile,notes:d.notes||''});db.customers.push(c)}if(d.address){let a=d.address_id?db.addresses.find(x=>x.id===d.address_id):null;if(d.add_new_address)a=null;if(d.make_default!==false)db.addresses.filter(x=>x.customer_id===c.id).forEach(x=>x.is_default=0);if(a)Object.assign(a,{label:d.address_label||a.label,address:d.address,area:d.area||'',is_default:d.make_default===false?0:1,notes:d.address_notes||'',updated_at:now()});else db.addresses.push(ensureTimes({id:id('addr'),customer_id:c.id,label:d.address_label||'عنوان',address:d.address,area:d.area||'',is_default:d.make_default===false?0:1,notes:d.address_notes||''}))}persist();return customerFull(c)},

      remove:async did=>{const d=db.drivers.find(x=>x.id===did);if(d)d.active=0;persist();return true}
    },

    tables:{
      list:async(all=false)=>clone(db.tables.filter(t=>all||active(t)).sort((a,b)=>a.sort_order-b.sort_order).map(t=>{const o=db.orders.filter(o=>o.table_id===t.id&&o.order_type==='dinein'&&!['closed','returned'].includes(o.status)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];return{...t,open_order_id:o?.id||null,open_order_no:o?.order_no||null,open_total:o?.total||0}})),

    },

    payments:{
      list:async(all=false)=>clone(db.payments.filter(p=>all||active(p)).sort((a,b)=>a.sort_order-b.sort_order)),
      save:async d=>{if(!d.name||!d.code)throw new Error('الاسم والكود مطلوبان');let p=d.id?db.payments.find(x=>x.id===d.id):null;if(p)Object.assign(p,{name:d.name,code:d.code,sort_order:Number(d.sort_order||0),active:d.active===false?0:1});else{if(db.payments.some(x=>x.code===d.code))throw new Error('الكود مستخدم بالفعل');p=ensureTimes({id:id('pay'),name:d.name,code:d.code,sort_order:Number(d.sort_order||db.payments.length+1),active:d.active===false?0:1});db.payments.push(p)}persist();return p.id},
      remove:async pid=>{const p=db.payments.find(x=>x.id===pid);if(p?.code==='cash')throw new Error('لا يمكن حذف طريقة الدفع النقدي');if(p)p.active=0;persist();return true}

    orders:{
      create:async d=>{const c=calc(d.items||[],d.delivery_fee,d.discount);const o=ensureTimes({id:id('o'),order_no:nextOrderNo(),order_type:d.order_type||'takeaway',customer_id:d.customer_id||null,address_id:d.address_id||null,driver_id:d.driver_id||null,table_id:d.table_id||null,shift_id:d.shift_id||null,user_id:d.user_id||null,status:d.status||'new',subtotal:c.subtotal,discount:c.discount,delivery_fee:c.delivery_fee,total:c.total,paid:Number(d.paid||0),payment_method:d.payment_method||'cash',notes:d.notes||'',items:(d.items||[]).map(i=>({...clone(i),id:id('oi'),total:Number(i.qty||1)*Number(i.unit_price||0)}))});db.orders.push(o);persist();return decorateOrder(o)},
      save:async(oid,d)=>{const o=db.orders.find(x=>x.id===oid);if(!o)throw new Error('الطلب غير موجود');const items=d.items?d.items.map(i=>({...clone(i),id:i.id||id('oi'),total:Number(i.qty||1)*Number(i.unit_price||0)})):o.items;const c=calc(items,d.delivery_fee??o.delivery_fee,d.discount??o.discount);Object.assign(o,{customer_id:d.customer_id??o.customer_id,address_id:d.address_id??o.address_id,driver_id:d.driver_id??o.driver_id,table_id:d.table_id??o.table_id,status:d.status||o.status,subtotal:c.subtotal,discount:c.discount,delivery_fee:c.delivery_fee,total:c.total,paid:Number(d.paid??o.paid),payment_method:d.payment_method||o.payment_method,notes:d.notes??o.notes,items,updated_at:now()});persist();return decorateOrder(o)},
      list:async type=>clone(db.orders.filter(o=>!type||o.order_type===type).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(decorateOrder)),
      get:async oid=>decorateOrder(db.orders.find(x=>x.id===oid)),
      status:async(oid,status,extra={})=>{const o=db.orders.find(x=>x.id===oid);if(!o)throw new Error('الطلب غير موجود');o.status=status;o.updated_at=now();if(status==='kitchen')o.kitchen_sent_at=now();if(status==='with_driver')o.driver_loaded_at=now();if(status==='closed')o.settled_at=now();if(status==='returned')o.returned_at=now();if(extra.driver_id)o.driver_id=extra.driver_id;if(extra.payment_method)o.payment_method=extra.payment_method;if(extra.paid!==undefined)o.paid=Number(extra.paid||0);persist();return decorateOrder(o)}
    },

    },

    dashboard:async()=>{const today=new Date().toISOString().slice(0,10),todayOrders=db.orders.filter(o=>String(o.created_at).slice(0,10)===today),closed=todayOrders.filter(o=>o.status==='closed');return{sales:closed.reduce((s,o)=>s+Number(o.total||0),0),orders:todayOrders.length,delivery:todayOrders.filter(o=>o.order_type==='delivery').length,openDelivery:db.orders.filter(o=>o.order_type==='delivery'&&!['closed','returned'].includes(o.status)).length,openTables:db.orders.filter(o=>o.order_type==='dinein'&&!['closed','returned'].includes(o.status)).length,expenses:db.expenses.filter(e=>String(e.created_at).slice(0,10)===today).reduce((s,e)=>s+Number(e.amount||0),0),recent:clone(db.orders.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,10))}},
    settings:{get:async()=>clone({...db.settings,supabase_password:Boolean(db.settings.supabase_password)}),save:async d=>{Object.assign(db.settings,clone(d));persist();return true}},

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const S={boot:null,user:null,page:'dashboard',cats:[],products:[],deliveryTab:'orders',adminTab:'business',shift:null,settings:{},payments:[]};
const AR={new:'جديد',open:'مفتوح',kitchen:'في المطبخ',ready:'جاهز',with_driver:'مع الطيار',awaiting_settlement:'بانتظار التسوية',closed:'مغلق',returned:'مرتجع'};
const TYPE={takeaway:'تيك أواي',dinein:'صالة',delivery:'دليفري'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م';

function toast(m,bad=false){const t=$('#toast');t.textContent=m;t.className='toast show'+(bad?' error':'');setTimeout(()=>t.className='toast',3000)}
function title(t){$('#title').textContent=t}
function closeModal(){ $('#modal').classList.add('hidden'); $('#modalBody').innerHTML=''; }
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden');const c=$('#modalClose');if(c)c.onclick=closeModal}
function roleAllowed(p){if(!S.user)return false;if(['administrator','admin'].includes(S.user.role))return true;return ['dashboard','pos','hall','delivery','shift'].includes(p)}
async function loadCatalog(all=false){S.cats=await window.geek.categories(all);S.products=await window.geek.products(all)}
async function refreshSettings(){S.settings=await window.geek.settings.get();S.payments=await window.geek.payments.list()}

async function boot(){S.boot=await window.geek.bootstrap();S.settings=S.boot.settings||{};if(!S.boot.licensed)return activation();if(!S.boot.hasUsers)return firstUser();login()}
function activation(){
  $('#root').innerHTML=`<section class="auth-shell"><div class="auth-card"><img class="brand-logo" src="logo.jpg"><h1>تفعيل Geek POS</h1><p>يلزم الإنترنت للتفعيل مرة واحدة فقط، وبعدها يعمل البرنامج دون اتصال.</p><div class="field"><label>مفتاح التفعيل</label><input id="lk" class="input" dir="ltr" placeholder="GEEK-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button id="act" class="btn btn-primary btn-block">تفعيل النسخة</button><p class="help">في حالة عدم امتلاك مفتاح صالح تواصل مع الإدارة المالكة للتطبيق.</p></div></section>`;
  $('#act').onclick=async()=>{const r=await window.geek.activate($('#lk').value);if(!r.success)return toast(r.message,true);toast(r.message);S.boot=await window.geek.bootstrap();firstUser()}
}
function firstUser(){
  $('#root').innerHTML=`<section class="auth-shell"><div class="auth-card"><img class="brand-logo" src="logo.jpg"><h1>إنشاء مدير النشاط</h1><p>الحساب الأول هو مدير النشاط التجاري.</p><div class="field"><label>الاسم</label><input id="n" class="input"></div><div class="field"><label>اسم المستخدم</label><input id="u" class="input" dir="ltr"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" class="input" dir="ltr"></div><button id="mk" class="btn btn-primary btn-block">إنشاء الحساب</button></div></section>`;
  $('#mk').onclick=async()=>{try{await window.geek.createFirstUser({name:$('#n').value,username:$('#u').value,password:$('#p').value});toast('تم إنشاء الحساب');login()}catch(e){toast(e.message,true)}}
}
function login(){
  $('#root').innerHTML=`<section class="auth-shell"><div class="auth-card"><img class="brand-logo" src="logo.jpg"><h1>Geek POS</h1><p>نظام إدارة نقاط البيع</p><div class="field"><label>اسم المستخدم</label><input id="lu" class="input" dir="ltr"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" class="input" dir="ltr"></div><button id="go" class="btn btn-primary btn-block">دخول</button></div></section>`;
  $('#go').onclick=async()=>{const u=await window.geek.login($('#lu').value,$('#lp').value);if(!u)return toast('بيانات الدخول غير صحيحة',true);S.user=u;S.shift=await window.geek.shifts.current(u.id);await refreshSettings();await loadCatalog();shell()}
}
function nav(){const x=[['dashboard','⌂','الرئيسية'],['pos','▣','الكاشير']];if(S.settings.enable_dinein!==false)x.push(['hall','▦','الصالة']);if(S.settings.enable_delivery!==false)x.push(['delivery','⌁','الدليفري']);x.push(['shift','◷','الورديات']);if(['administrator','admin'].includes(S.user.role))x.push(['reports','◫','التقارير'],['admin','⚙','لوحة الإدارة']);return x.filter(a=>roleAllowed(a[0])).map(a=>`<button data-page="${a[0]}"><span class="icon">${a[1]}</span><span class="label">${a[2]}</span></button>`).join('')}
function shell(){
  $('#root').innerHTML=`<div class="app"><aside class="sidebar"><div class="side-brand"><img src="logo.jpg"><div><strong>Geek POS</strong><small>${esc(S.settings.business_name||'نقطة البيع')}</small></div></div><nav class="nav">${nav()}</nav><div class="side-foot"><div class="user-chip"><strong>${esc(S.user.name)}</strong><span>${S.user.role==='administrator'?'Administrator':S.user.role==='admin'?'مدير النشاط':'كاشير'}</span></div><button id="out" class="btn btn-ghost btn-block">تسجيل الخروج</button></div></aside><section class="workspace"><header class="topbar"><h2 id="title"></h2><div class="top-actions"><span class="net-dot"></span><span class="muted" id="shiftState">${S.shift?'وردية مفتوحة':'لا توجد وردية'}</span><button id="sync" class="btn btn-sm btn-ghost">مزامنة</button></div></header><div id="content" class="content"></div></section></div>`;
  $$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#out').onclick=()=>{S.user=null;login()};$('#sync').onclick=async()=>{const r=await window.geek.sync();toast(r.success?`تمت مزامنة ${r.count} عنصر`:r.message,!r.success)};go('dashboard')
}
async function go(p){if(!roleAllowed(p))return;S.page=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));const f={dashboard,pos,hall,delivery,shift,reports,admin:adminPanel};await f[p]()}

async function dashboard(){
  title('لوحة المتابعة');const d=await window.geek.dashboard();
  $('#content').innerHTML=`<div class="grid grid-4"><div class="card kpi"><div class="label">مبيعات اليوم</div><div class="value">${money(d.sales)}</div></div><div class="card kpi"><div class="label">طلبات اليوم</div><div class="value">${d.orders}</div></div><div class="card kpi"><div class="label">طاولات مشغولة</div><div class="value">${d.openTables}</div></div><div class="card kpi"><div class="label">دليفري مفتوح</div><div class="value">${d.openDelivery}</div></div></div><div class="grid grid-2 dashboard-lower"><div class="card"><div class="section-title"><h3>آخر الطلبات</h3><button id="sale" class="btn btn-cyan btn-sm">بيع جديد</button></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>النوع</th><th>الحالة</th><th>الإجمالي</th><th>الوقت</th></tr></thead><tbody>${d.recent.map(o=>`<tr><td>#${o.order_no}</td><td>${TYPE[o.order_type]||o.order_type}</td><td><span class="badge blue">${AR[o.status]||o.status}</span></td><td>${money(o.total)}</td><td>${new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد طلبات</td></tr>'}</tbody></table></div></div><div class="card quick"><h3>تشغيل سريع</h3><div class="quick-grid"><button data-q="pos">تيك أواي</button>${S.settings.enable_dinein!==false?'<button data-q="hall">فتح الصالة</button>':''}${S.settings.enable_delivery!==false?'<button data-q="delivery">طلب دليفري</button>':''}<button data-q="shift">الوردية</button></div><div class="metric-row"><span>مصروفات اليوم</span><b>${money(d.expenses)}</b></div></div></div>`;
  $('#sale').onclick=()=>go('pos');$$('[data-q]').forEach(b=>b.onclick=()=>go(b.dataset.q));
}


</script><!-- sales.js -->
<script>
async function pos(){await saleScreen({mode:'takeaway'})}
async function saleScreen({mode='takeaway',table=null,order=null}={}){
  title(mode==='dinein'?`الصالة — ${table?.name||''}`:'الكاشير');await Promise.all([loadCatalog(),refreshSettings()]);let cat='all';let cart=(order?.items||[]).map(i=>({id:i.product_id,name:i.product_name,price:Number(i.unit_price),qty:Number(i.qty),notes:i.notes||''}));let notes=order?.notes||'';
  const draw=()=>{const prods=cat==='all'?S.products:S.products.filter(p=>p.category_id===cat);const total=cart.reduce((s,x)=>s+x.qty*x.price,0);$('#content').innerHTML=`<div class="pos-layout"><div class="card catalog"><div class="section-title"><div><h3>${mode==='dinein'?'طلب '+esc(table.name):'الأصناف'}</h3>${order?`<span class="badge amber">طلب #${order.order_no}</span>`:''}</div><input id="ps" class="input search-box" placeholder="بحث عن صنف"></div><div class="category-bar"><button class="category-btn ${cat==='all'?'active':''}" data-cat="all">الكل</button>${S.cats.map(c=>`<button class="category-btn ${cat===c.id?'active':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('')}</div><div class="products">${prods.map(p=>`<button class="product" data-product="${p.id}"><strong>${esc(p.name)}</strong><span class="muted">${esc(p.category_name||'')}</span><span class="price">${money(p.price)}</span></button>`).join('')||'<div class="empty">أضف أصناف من لوحة الإدارة</div>'}</div></div><div class="card cart"><div class="order-modes">${mode==='dinein'?'<button id="backHall" class="btn btn-ghost">العودة للصالة</button>':`<button class="btn btn-cyan">تيك أواي</button>${S.settings.enable_dinein!==false?'<button class="btn" data-mode="hall">صالة</button>':''}${S.settings.enable_delivery!==false?'<button class="btn" data-mode="delivery">دليفري</button>':''}`}</div><div class="cart-items">${cart.map((i,k)=>`<div class="cart-row"><div><b>${esc(i.name)}</b><div class="muted">${money(i.price)}</div></div><div class="qty"><button data-minus="${k}">−</button><b>${i.qty}</b><button data-plus="${k}">+</button></div><div>${money(i.qty*i.price)}</div></div>`).join('')||'<div class="empty">اختر الأصناف من القائمة</div>'}</div><div class="field compact"><label>ملاحظات الطلب</label><input id="saleNotes" class="input" value="${esc(notes)}"></div><div class="field compact"><label>طريقة الدفع</label><select id="pay" class="select">${S.payments.map(p=>`<option value="${esc(p.code)}" ${p.code===(order?.payment_method||'cash')?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="cart-total"><div class="total-line"><span>الإجمالي</span><span class="grand">${money(total)}</span></div>${mode==='dinein'?'<div class="dual-actions"><button id="hold" class="btn btn-cyan">حفظ على الطاولة</button><button id="finish" class="btn btn-green">تحصيل وإغلاق</button></div>':'<button id="finish" class="btn btn-primary btn-block">تحصيل وإتمام البيع</button>'}</div></div></div>`;
    $$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;notes=$('#saleNotes')?.value||notes;draw()});$$('[data-product]').forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id===b.dataset.product),e=cart.find(x=>x.id===p.id);e?e.qty++:cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});notes=$('#saleNotes')?.value||notes;draw()});$$('[data-plus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;notes=$('#saleNotes')?.value||notes;draw()});$$('[data-minus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.minus;cart[i].qty--;if(cart[i].qty<=0)cart.splice(i,1);notes=$('#saleNotes')?.value||notes;draw()});$('#ps').oninput=e=>$$('[data-product]').forEach(b=>b.style.display=b.textContent.includes(e.target.value)?'':'');$$('[data-mode]').forEach(b=>b.onclick=()=>go(b.dataset.mode));if($('#backHall'))$('#backHall').onclick=()=>go('hall');
    const payload=status=>({order_type:mode,table_id:table?.id||null,user_id:S.user.id,shift_id:S.shift?.id||null,status,paid:status==='closed'?total:0,payment_method:$('#pay')?.value||'cash',notes:$('#saleNotes')?.value||'',items:cart.map(x=>({product_id:x.id,product_name:x.name,qty:x.qty,unit_price:x.price,notes:x.notes||''}))});
    const save=async status=>{if(!S.shift)return toast('افتح وردية أولاً',true);if(!cart.length)return toast('أضف صنفاً واحداً على الأقل',true);try{const o=order?await window.geek.orders.save(order.id,payload(status)):await window.geek.orders.create(payload(status));order=o;toast(status==='closed'?`تم إغلاق الطلب #${o.order_no}`:`تم حفظ الطلب على ${table.name}`);if(status==='closed'){cart=[];return mode==='dinein'?go('hall'):draw()}draw()}catch(e){toast(e.message,true)}};
    if($('#hold'))$('#hold').onclick=()=>save('open');$('#finish').onclick=()=>save('closed');
  };draw();
}

async function hall(){title('الصالة');if(S.settings.enable_dinein===false){$('#content').innerHTML='<div class="card empty">الصالة غير مفعلة من لوحة الإدارة</div>';return}const tables=await window.geek.tables.list();$('#content').innerHTML=`<div class="section-title"><div><h3>خريطة الصالة</h3><span class="muted">اضغط على أي طاولة لفتح الطلب أو استكماله</span></div><button id="manageTables" class="btn btn-ghost btn-sm">إدارة الطاولات</button></div><div class="tables-grid">${tables.map(t=>`<button class="table-tile ${t.open_order_id?'occupied':'free'}" data-table="${t.id}"><div class="table-icon">▦</div><strong>${esc(t.name)}</strong><small>${esc(t.area||'الصالة')} · ${t.seats} مقاعد</small><span>${t.open_order_id?`طلب #${t.open_order_no} · ${money(t.open_total)}`:'متاحة'}</span></button>`).join('')||'<div class="card empty">لا توجد طاولات. أضفها من لوحة الإدارة.</div>'}</div>`;$$('[data-table]').forEach(b=>b.onclick=async()=>{const t=tables.find(x=>x.id===b.dataset.table),o=await window.geek.tables.order(t.id);saleScreen({mode:'dinein',table:t,order:o})});$('#manageTables').onclick=()=>{S.adminTab='tables';go('admin')}}

<script>

async function delivery(){title('إدارة الدليفري');if(S.settings.enable_delivery===false){$('#content').innerHTML='<div class="card empty">الدليفري غير مفعل من لوحة الإدارة</div>';return}const tabs=[['orders','طلبات الدليفري'],['new','طلب جديد'],['customers','العملاء'],['settlement','تسوية الطيار']];$('#content').innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="tab ${S.deliveryTab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="dbody"></div>`;$$('[data-tab]').forEach(b=>b.onclick=()=>{S.deliveryTab=b.dataset.tab;delivery()});if(S.deliveryTab==='new')return newDelivery();if(S.deliveryTab==='customers')return customers();const [orders,drivers]=await Promise.all([window.geek.orders.list('delivery'),window.geek.drivers.list()]);if(S.deliveryTab==='settlement')return settlement(orders);$('#dbody').innerHTML=`<div class="delivery-shell"><div class="card delivery-list"><div class="toolbar"><input id="dq" class="input" placeholder="بحث بالعميل / المنطقة / رقم الطلب"><button id="dn" class="btn btn-cyan btn-sm">طلب جديد</button></div><div class="compact-list">${orders.map(o=>`<button class="order-card" data-oid="${o.id}"><div><b>#${o.order_no} — ${esc(o.customer_name||'بدون اسم')}</b><small>${esc(o.area||'')} · ${new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></div><div><div class="amount">${money(o.total)}</div><span class="badge ${o.status==='closed'?'green':o.status==='returned'?'red':'blue'}">${AR[o.status]||o.status}</span></div></button>`).join('')||'<div class="empty">لا توجد طلبات دليفري</div>'}</div></div><div id="detail" class="card delivery-detail"><div class="detail-empty">اختر طلباً لعرض التفاصيل</div></div></div>`;$('#dn').onclick=()=>{S.deliveryTab='new';delivery()};$$('[data-oid]').forEach(b=>b.onclick=async()=>deliveryDetail(await window.geek.orders.get(b.dataset.oid),drivers));$('#dq').oninput=e=>$$('[data-oid]').forEach(b=>b.style.display=b.textContent.includes(e.target.value)?'':'')}
function deliveryDetail(o,drivers){$('#detail').innerHTML=`<div class="section-title"><div><h3>طلب #${o.order_no}</h3><span class="badge blue">${AR[o.status]||o.status}</span></div><b class="grand">${money(o.total)}</b></div><div class="customer-hero"><div><strong>${esc(o.customer_name||'')}</strong><div class="muted" dir="ltr">${esc(o.customer_mobile||'')}</div><div>${esc(o.area||'')} — ${esc(o.address||'')}</div></div><button id="editDelivery" class="btn btn-ghost btn-sm">تعديل الطلب</button></div><div class="mini-items">${o.items.map(i=>`<div class="mini-item"><b>${esc(i.product_name)}</b><span>${i.qty}</span><span>${money(i.total)}</span><span></span></div>`).join('')}</div><div class="actions delivery-actions"><button id="kitchen" class="btn btn-cyan">إرسال المطبخ</button><button id="ready" class="btn">جاهز</button><select id="driver" class="select driver-select"><option value="">اختر الطيار</option>${drivers.map(d=>`<option value="${d.id}" ${o.driver_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><button id="load" class="btn btn-primary">تحميل على الطيار</button><button id="await" class="btn btn-ghost">بانتظار التسوية</button><button id="return" class="btn btn-red">مرتجع</button></div>`;$('#editDelivery').onclick=()=>newDelivery(o);$('#kitchen').onclick=async()=>{const n=await window.geek.orders.status(o.id,'kitchen');toast('تم إرسال الطلب للمطبخ');if(S.settings.kitchen_printer)await window.geek.printers.print(ticketHtml(n,'طلب مطبخ'),S.settings.kitchen_printer);delivery()};$('#ready').onclick=async()=>{await window.geek.orders.status(o.id,'ready');toast('تم تحديث الطلب إلى جاهز');delivery()};$('#load').onclick=async()=>{if(!$('#driver').value)return toast('اختر الطيار أولاً',true);const n=await window.geek.orders.status(o.id,'with_driver',{driver_id:$('#driver').value});toast('تم تحميل الطلب على الطيار');await window.geek.printers.print(ticketHtml(n,'دليفري'),S.settings.default_printer||'');delivery()};$('#await').onclick=async()=>{await window.geek.orders.status(o.id,'awaiting_settlement',{});toast('تم نقل الطلب إلى التسوية');delivery()};$('#return').onclick=async()=>{await window.geek.orders.status(o.id,'returned',{});toast('تم تسجيل مرتجع');delivery()}}

<script>
async function newDelivery(editOrder=null,presetCustomer=null){S.deliveryTab='new';await Promise.all([loadCatalog(),refreshSettings()]);let items=(editOrder?.items||[]).map(i=>({product_id:i.product_id,product_name:i.product_name,qty:Number(i.qty),unit_price:Number(i.unit_price)}));let customer=presetCustomer||null;$('#dbody').innerHTML=`<div class="card delivery-editor"><div class="section-title"><div><h3>${editOrder?'تعديل طلب #'+editOrder.order_no:'طلب دليفري جديد'}</h3><span class="muted">ابدأ برقم الموبايل</span></div><button id="backOrders" class="btn btn-ghost btn-sm">الطلبات</button></div><div class="form-grid"><div class="field"><label>رقم الموبايل</label><input id="cm" class="input" dir="ltr" value="${esc(editOrder?.customer_mobile||customer?.mobile||'')}"></div><div class="field"><label>اسم العميل</label><input id="cn" class="input" value="${esc(editOrder?.customer_name||customer?.name||'')}"></div><div class="field"><label>العنوان المحفوظ</label><select id="addr" class="select"><option value="">عنوان جديد / غير محفوظ</option></select></div><div class="field"><label>المنطقة</label><input id="ca" class="input" value="${esc(editOrder?.area||'')}"></div><div class="field wide"><label>العنوان</label><input id="cad" class="input" value="${esc(editOrder?.address||'')}"></div><div class="field wide"><label>ملاحظات العميل</label><input id="cno" class="input"></div></div><div class="delivery-products"><div class="section-title"><h3>الأصناف</h3><span class="muted">أضف الأصناف داخل نفس شاشة الدليفري</span></div><div class="picker"><select id="ip" class="select">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select><input id="iq" class="input" type="number" min="1" value="1"><button id="add" class="btn btn-cyan">إضافة</button></div><div id="ilist" class="mini-items"></div></div><div class="form-grid"><div class="field"><label>رسوم التوصيل</label><input id="fee" type="number" class="input" value="${Number(editOrder?.delivery_fee||0)}"></div><div class="field"><label>ملاحظات الطلب</label><input id="ono" class="input" value="${esc(editOrder?.notes||'')}"></div></div><div class="actions"><button id="save" class="btn btn-primary">${editOrder?'حفظ التعديلات':'إنشاء الطلب'}</button><button id="saveKitchen" class="btn btn-cyan">حفظ وإرسال للمطبخ</button></div></div>`;
  const redraw=()=>{$('#ilist').innerHTML=items.length?items.map((i,k)=>`<div class="mini-item"><b>${esc(i.product_name)}</b><span><input class="qty-input" data-qidx="${k}" type="number" min="1" value="${i.qty}"></span><span>${money(i.qty*i.unit_price)}</span><button class="btn btn-red btn-sm" data-rm="${k}">×</button></div>`).join(''):'<div class="empty">لم تتم إضافة أصناف</div>';$$('[data-qidx]').forEach(x=>x.onchange=()=>{items[+x.dataset.qidx].qty=Math.max(1,Number(x.value||1));redraw()});$$('[data-rm]').forEach(x=>x.onclick=()=>{items.splice(+x.dataset.rm,1);redraw()})};
  const applyCustomer=c=>{if(!c)return;customer=c;$('#cn').value=c.name||'';$('#cno').value=c.notes||'';$('#addr').innerHTML='<option value="">عنوان جديد / غير محفوظ</option>'+c.addresses.map(a=>`<option value="${a.id}">${esc(a.label||a.area||'عنوان')} — ${esc(a.address)}</option>`).join('');const chosen=editOrder?.address_id||c.addresses?.[0]?.id;if(chosen){$('#addr').value=chosen;const a=c.addresses.find(x=>x.id===chosen);if(a){$('#ca').value=a.area||'';$('#cad').value=a.address||''}}};
  const findCustomer=async()=>{const m=$('#cm').value.trim();if(m.length<6)return;const c=await window.geek.customers.find(m);if(c){applyCustomer(c);toast('تم العثور على العميل')}else{customer=null;$('#cn').value='';$('#addr').innerHTML='<option value="">عميل جديد — اكتب العنوان</option>';$('#ca').value='';$('#cad').value=''}};
  $('#cm').onblur=findCustomer;$('#addr').onchange=()=>{const a=customer?.addresses?.find(x=>x.id===$('#addr').value);if(a){$('#ca').value=a.area||'';$('#cad').value=a.address||''}};$('#add').onclick=()=>{const p=S.products.find(x=>x.id===$('#ip').value);if(!p)return;const e=items.find(x=>x.product_id===p.id);if(e)e.qty+=Number($('#iq').value||1);else items.push({product_id:p.id,product_name:p.name,qty:Number($('#iq').value||1),unit_price:Number(p.price)});redraw()};$('#backOrders').onclick=()=>{S.deliveryTab='orders';delivery()};
  const save=async status=>{if(!S.shift)return toast('افتح وردية أولاً',true);if(!$('#cm').value.trim()||!$('#cn').value.trim()||!$('#cad').value.trim()||!items.length)return toast('أكمل بيانات العميل والعنوان والأصناف',true);try{const selectedAddress=$('#addr').value;const c=await window.geek.customers.save({id:customer?.id,name:$('#cn').value,mobile:$('#cm').value,notes:$('#cno').value,address_id:selectedAddress||undefined,add_new_address:!selectedAddress,address:$('#cad').value,area:$('#ca').value,address_label:'عنوان دليفري',make_default:true});const full=await window.geek.customers.get(c.id),addressId=full.addresses?.[0]?.id;const payload={order_type:'delivery',customer_id:c.id,address_id:addressId,user_id:S.user.id,shift_id:S.shift.id,status,delivery_fee:Number($('#fee').value||0),notes:$('#ono').value,items};const o=editOrder?await window.geek.orders.save(editOrder.id,payload):await window.geek.orders.create(payload);if(status==='kitchen'&&S.settings.kitchen_printer)await window.geek.printers.print(ticketHtml(o,'طلب مطبخ'),S.settings.kitchen_printer);toast(editOrder?'تم حفظ التعديلات':`تم إنشاء طلب #${o.order_no}`);S.deliveryTab='orders';delivery()}catch(e){toast(e.message,true)}};
  $('#save').onclick=()=>save(editOrder?.status||'new');$('#saveKitchen').onclick=()=>save('kitchen');redraw();if(presetCustomer)applyCustomer(presetCustomer);else if(editOrder?.customer_mobile)findCustomer();
}


</script><!-- delivery_customers.js -->
<script>
async function customers(){$('#dbody').innerHTML=`<div class="card"><div class="toolbar"><input id="cq" class="input" placeholder="بحث بالاسم / الموبايل / العنوان / المنطقة"><button id="xlsx" class="btn btn-green">تصدير Excel</button></div><div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الموبايل</th><th>العنوان</th><th>المنطقة</th><th>الطلبات</th><th>إجمالي التعامل</th><th>آخر طلب</th><th></th></tr></thead><tbody id="crows"></tbody></table></div></div>`;const draw=async()=>{const r=await window.geek.customers.list($('#cq').value);$('#crows').innerHTML=r.map(c=>`<tr><td>${esc(c.name)}</td><td dir="ltr">${esc(c.mobile)}</td><td>${esc(c.address||'')}</td><td>${esc(c.area||'')}</td><td>${c.order_count}</td><td>${money(c.total_spent)}</td><td>${c.last_order?new Date(c.last_order).toLocaleDateString('ar-EG'):'—'}</td><td><button class="btn btn-cyan btn-sm" data-customer="${c.id}">طلب جديد</button></td></tr>`).join('');$$('[data-customer]').forEach(b=>b.onclick=async()=>newDelivery(null,await window.geek.customers.get(b.dataset.customer)))};$('#cq').oninput=draw;$('#xlsx').onclick=async()=>{const r=await window.geek.customers.export();if(r.success)toast('تم تصدير Excel')};draw()}
function settlement(orders){const x=orders.filter(o=>['with_driver','awaiting_settlement'].includes(o.status)),total=x.reduce((s,o)=>s+Number(o.total||0),0);$('#dbody').innerHTML=`<div class="card"><div class="section-title"><div><h3>تسوية الطيار</h3><span class="muted">حدد الطلبات التي تم تسليمها أو المرتجعة فقط</span></div><div class="grand">${money(total)}</div></div><div class="table-wrap"><table class="table"><thead><tr><th></th><th>#</th><th>الطيار</th><th>العميل</th><th>المنطقة</th><th>القيمة</th></tr></thead><tbody>${x.map(o=>`<tr><td><input class="ck" type="checkbox" value="${o.id}"></td><td>#${o.order_no}</td><td>${esc(o.driver_name||'')}</td><td>${esc(o.customer_name||'')}</td><td>${esc(o.area||'')}</td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد طلبات لدى الطيارين</td></tr>'}</tbody></table></div><div class="actions"><button id="settle" class="btn btn-green">استلام الكاش وإغلاق المحدد</button><button id="ret" class="btn btn-red">تسجيل المحدد مرتجع</button></div></div>`;const bulk=async s=>{const ids=$$('.ck:checked').map(c=>c.value);if(!ids.length)return toast('اختر طلباً واحداً على الأقل',true);for(const id of ids){const o=await window.geek.orders.get(id);await window.geek.orders.status(id,s,s==='closed'?{paid:o.total,payment_method:'cash'}:{})}toast('تمت التسوية');delivery()};$('#settle').onclick=()=>bulk('closed');$('#ret').onclick=()=>bulk('returned')}

async function adminPayments(){const rows=await window.geek.payments.list(true);$('#adminBody').innerHTML=`<div class="card"><div class="section-title"><h3>طرق الدفع</h3><button id="newPayment" class="btn btn-cyan">+ طريقة دفع</button></div><div class="management-list">${rows.map(p=>`<div class="manage-row ${!p.active?'disabled-row':''}"><div><b>${esc(p.name)}</b><small dir="ltr">${esc(p.code)}</small></div><div class="actions"><button class="btn btn-ghost btn-sm" data-epay="${p.id}">تعديل</button><button class="btn btn-red btn-sm" data-dpay="${p.id}">إيقاف</button></div></div>`).join('')}</div></div>`;const form=p=>{showModal(`<div class="section-title"><h3>${p?'تعديل طريقة الدفع':'طريقة دفع جديدة'}</h3><button id="modalClose" class="btn btn-ghost btn-sm">×</button></div><div class="field"><label>الاسم</label><input id="fpyn" class="input" value="${esc(p?.name||'')}"></div><div class="field"><label>الكود الداخلي</label><input id="fpyc" class="input" dir="ltr" value="${esc(p?.code||'')}"></div><div class="field"><label>الترتيب</label><input id="fpyo" type="number" class="input" value="${p?.sort_order||rows.length+1}"></div><label class="check"><input id="fpya" type="checkbox" ${p?.active===0?'':'checked'}> فعالة</label><button id="savePayment" class="btn btn-primary">حفظ</button>`);$('#savePayment').onclick=async()=>{try{await window.geek.payments.save({id:p?.id,name:$('#fpyn').value,code:$('#fpyc').value,sort_order:Number($('#fpyo').value),active:$('#fpya').checked});closeModal();await refreshSettings();adminPayments()}catch(e){toast(e.message,true)}}};$('#newPayment').onclick=()=>form(null);$$('[data-epay]').forEach(b=>b.onclick=()=>form(rows.find(x=>x.id===b.dataset.epay)));$$('[data-dpay]').forEach(b=>b.onclick=async()=>{try{await window.geek.payments.remove(b.dataset.dpay);await refreshSettings();adminPayments()}catch(e){toast(e.message,true)}})}
async function adminCloud(){const s=await window.geek.settings.get();$('#adminBody').innerHTML=`<div class="grid grid-2"><div class="card"><h3>Supabase</h3><p class="muted">هذه البيانات خاصة بالمزامنة السحابية بعد تسجيل دخول حساب الفرع.</p><div class="field"><label>URL</label><input id="su" class="input" dir="ltr" value="${esc(s.supabase_url||S.boot.supabaseDefault.url)}"></div><div class="field"><label>Publishable Key</label><input id="sk" class="input" dir="ltr" value="${esc(s.supabase_key||S.boot.supabaseDefault.key)}"></div><div class="field"><label>Email</label><input id="se" class="input" dir="ltr" value="${esc(s.supabase_email||'')}"></div><div class="field"><label>Password</label><input id="sp" type="password" class="input" dir="ltr" placeholder="${s.supabase_password?'محفوظ — اتركه فارغاً دون تغيير':''}"></div><div class="field"><label>Branch ID</label><input id="sb" class="input" dir="ltr" value="${esc(s.branch_id||'')}"></div><button id="sc" class="btn btn-primary">حفظ واختبار المزامنة</button></div><div class="card"><h3>حالة الربط</h3><div class="info-box"><b>العمل Offline</b><span>فعال دائمًا بعد التفعيل</span><b>المزامنة</b><span>كل دقيقتين عند توفر الاتصال</span><b>قاعدة الجهاز</b><span>محلية ومستقلة عن الإنترنت</span></div></div></div>`;$('#sc').onclick=async()=>{const x={supabase_url:$('#su').value,supabase_key:$('#sk').value,supabase_email:$('#se').value,branch_id:$('#sb').value};if($('#sp').value)x.supabase_password=$('#sp').value;await window.geek.settings.save(x);const r=await window.geek.sync();toast(r.success?`تم الربط ومزامنة ${r.count} عنصر`:r.message,!r.success)}}
async function adminSystem(){$('#adminBody').innerHTML=`<div class="grid grid-2"><div class="card"><h3>إدارة النظام — الشركة المنتجة</h3><div class="info-box"><b>الإصدار</b><span>${esc(S.boot.version)}</span><b>بصمة الجهاز</b><span class="mono">${esc(S.boot.machineHash)}</span><b>حالة الترخيص</b><span>مفعّل</span></div></div><div class="card"><h3>التحديثات التقنية</h3><p class="muted">هذه المنطقة مخصصة لدور Administrator فقط، ومنفصلة عن Admin صاحب النشاط.</p><button id="forceSync" class="btn btn-cyan">مزامنة الآن</button></div></div>`;$('#forceSync').onclick=async()=>{const r=await window.geek.sync();toast(r.success?`تمت مزامنة ${r.count} عنصر`:r.message,!r.success)}}

</script><!-- boot.js -->
<script>
boot().catch(e=>{document.body.innerHTML='<div class="auth-shell"><div class="auth-card"><h1>تعذر تشغيل Geek POS</h1><p>'+esc(e.message)+'</p></div></div>'});

</script></body></html>
