name: Build Geek POS Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python for Windows icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/main/database.js
          node --check src/main/license.js
          node --check src/main/secrets.js
          node --check src/main/sync.js
          Get-ChildItem src/renderer/modules/*.js | ForEach-Object { node --check $_.FullName }

      - name: Generate Windows icon from Geek POS logo
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image,ImageFile; ImageFile.LOAD_TRUNCATED_IMAGES=True; im=Image.open(r'build/logo.jpg').convert('RGBA'); im.save(r'build/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Install dependencies
        run: npm install

      - name: Smoke test database startup
        shell: pwsh
        run: |
          node -e "(async()=>{const fs=require('fs');const path=require('path');const Database=require('./src/main/database');const dir=path.join(process.cwd(),'.geek-smoke');fs.rmSync(dir,{recursive:true,force:true});const db=await new Database(dir).init();const counts=[db.scalar('SELECT COUNT(*) FROM categories'),db.scalar('SELECT COUNT(*) FROM dining_tables'),db.scalar('SELECT COUNT(*) FROM payment_methods')];console.log('GEEK_DB_SMOKE_OK',counts.join(','));fs.rmSync(dir,{recursive:true,force:true});})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          $exe = "release\win-unpacked\Geek POS.exe"
          $wasm = "release\win-unpacked\resources\sql-wasm.wasm"
          $asar = "release\win-unpacked\resources\app.asar"
          if (-not (Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          if (-not (Test-Path $wasm)) { throw "SQL.js WASM runtime not found: $wasm" }
          if (-not (Test-Path $asar)) { throw "Electron app.asar not found: $asar" }
          Write-Host "GEEK_PACKAGED_RUNTIME_OK"
          Get-Item $exe,$wasm,$asar | Select-Object Name,Length,FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geek-POS-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v$version"
          $exists = $true
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          if (-not $exists) {
            gh release create $tag --repo ${{ github.repository }} --target ${{ github.sha }} --title "Geek POS $version" --notes "نسخة Windows من Geek POS. التفعيل يتم بمفتاح صالح أثناء التثبيت."
          }
          gh release upload $tag "release/*.exe" --repo ${{ github.repository }} --clobber
